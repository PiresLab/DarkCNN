[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "darkcnn"
version = "0.1.0"
description = "Pipeline de cortes verticais (9:16) a partir de vídeos longos, com revisão manual"
requires-python = ">=3.10"
dependencies = [
    "google-genai",
    "pydantic>=2",
    "pyyaml",
    "faster-whisper",
    "numpy",
    "yt-dlp>=2025.11.12",
    "requests",
    "sqlalchemy>=2",
]

[project.optional-dependencies]
dev = ["pytest", "fastapi", "uvicorn", "httpx", "python-multipart"]
tiktok = ["autotok>=2.0.1"]  # AGPL-3.0: leia a seção "TikTok" do README
web = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart", "psycopg[binary]>=3.1", "croniter"]

[project.scripts]
darkcnn = "darkcnn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
darkcnn = ["prompts/*.md", "web/static/*", "web/static/assets/*", "assets/fonts/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F"]
